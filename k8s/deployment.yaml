apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-processing-agent
  labels:
    app: graph-processing-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graph-processing-agent
  template:
    metadata:
      labels:
        app: graph-processing-agent
    spec:
      containers:
        - name: graph-processing-agent
          image: graph-processing-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: graph-processing-agent-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
