spring.application.name=graph-processing-agent

# Server Configuration
server.port=8083

# Google Cloud Spanner Configuration
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:mltf-506212}
spring.cloud.gcp.spanner.instance-id=${GCP_SPANNER_INSTANCE_ID:${SPANNER_INSTANCE_ID:mltf-spanner}}
spring.cloud.gcp.spanner.database=${GCP_SPANNER_DATABASE_ID:${SPANNER_DATABASE:mortgage_graph_db}}
spring.cloud.gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:}

# Optional Local/Secret Configuration Imports (Ignored by Git)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties,optional:file:./.env

# Google Gen AI (Gemini) Configuration
google.genai.api-key=${GEMINI_API_KEY:${google.gemini.api-key:}}
google.gemini.api-key=${GEMINI_API_KEY:${google.genai.api-key:}}
google.genai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Spring Autoconfigure Exclusions (direct DatabaseClient is configured via SpannerConfig)
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.spanner.GcpSpannerAutoConfiguration,com.google.cloud.spring.autoconfigure.spanner.SpannerTransactionManagerAutoConfiguration

# Configurable Triangulation & Fraud Rules
# Rule 1: Applicant Name consistency across application and documents
pipeline.rules.name-matching.enabled=true
pipeline.rules.name-matching.ignore-case=true

# Rule 2: Employer Name matching (Payslip employer vs Bank payroll sender)
pipeline.rules.employer-matching.enabled=true
pipeline.rules.employer-matching.ignore-case=true

# Rule 3: Salary vs Deposit variance threshold (default 5% = 0.05)
pipeline.rules.salary-variance.enabled=true
pipeline.rules.salary-variance.max-variance-ratio=0.05

# Rule 4: Minimum required net income threshold (disabled by default)
pipeline.rules.minimum-salary.enabled=false
pipeline.rules.minimum-salary.min-amount=1000.00

# Actuator & Probes for Kubernetes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.bagusxmahendra.mltf.graph_processing_agent=INFO
logging.level.org.springframework.web.reactive=DEBUG

